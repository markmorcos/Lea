<g transform="translate(28.0,26) scale(0.38)"><path d="M22 82 V46 a26 26 0 0 1 52 0 V82" fill="none" stroke="#F5EFE4" stroke-width="5.5" stroke-linecap="round"/><circle cx="48" cy="58" r="7.5" fill="#BB6E47"/></g>
<text x="66.0" y="44.0" font-family="Spectral Medium" font-size="15" fill="#FBF8F2" text-anchor="start">Lea Zoe Pfaffeneder</text>
<text x="67.0" y="57.0" font-family="IBM Plex Mono" font-size="8.5" fill="#C9D6CE" text-anchor="start" letter-spacing="2.2">PSYCHOLOGISCHE BERATUNG</text>
<text x="34.0" y="96.0" font-family="Spectral SemiBold" font-size="25" fill="#FBF8F2" text-anchor="start">Womit ich Sie begleite</text>
<text x="34.0" y="150.0" font-family="Spectral" font-size="12" fill="#3C5A4C" text-anchor="start">Themen, keine Diagnosen — für all das gibt es hier Platz.</text>
<circle cx="39.0" cy="172" r="4.5" fill="#F1DBCC"/>
<circle cx="39.0" cy="172" r="1.8" fill="#A25836"/>
<text x="52.0" y="176.0" font-family="Source Sans 3 SemiBold" font-size="12" fill="#232E2A" text-anchor="start">Stress &amp; Überforderung</text>
<text x="52.0" y="190.0" font-family="Source Sans 3" font-size="10" fill="#5C6A64" text-anchor="start">Wenn der Alltag zu viel wird und Sie zur Ruhe kommen möchten.</text>
<circle cx="39.0" cy="211" r="4.5" fill="#F1DBCC"/>
<circle cx="39.0" cy="211" r="1.8" fill="#A25836"/>
<text x="52.0" y="215.0" font-family="Source Sans 3 SemiBold" font-size="12" fill="#232E2A" text-anchor="start">Lebenskrisen &amp; Veränderungen</text>
<text x="52.0" y="229.0" font-family="Source Sans 3" font-size="10" fill="#5C6A64" text-anchor="start">In Umbruchphasen Halt und neue Perspektiven finden.</text>
<circle cx="39.0" cy="250" r="4.5" fill="#F1DBCC"/>
<circle cx="39.0" cy="250" r="1.8" fill="#A25836"/>
<text x="52.0" y="254.0" font-family="Source Sans 3 SemiBold" font-size="12" fill="#232E2A" text-anchor="start">Selbstwert &amp; Selbstvertrauen</text>
<text x="52.0" y="268.0" font-family="Source Sans 3" font-size="10" fill="#5C6A64" text-anchor="start">Ein freundlicherer, stärkender Blick auf sich selbst.</text>
<circle cx="39.0" cy="289" r="4.5" fill="#F1DBCC"/>
<circle cx="39.0" cy="289" r="1.8" fill="#A25836"/>
<text x="52.0" y="293.0" font-family="Source Sans 3 SemiBold" font-size="12" fill="#232E2A" text-anchor="start">Orientierung &amp; Entscheidungen</text>
<text x="52.0" y="307.0" font-family="Source Sans 3" font-size="10" fill="#5C6A64" text-anchor="start">Klarheit gewinnen, wenn die Richtung unklar ist.</text>
<circle cx="39.0" cy="328" r="4.5" fill="#F1DBCC"/>
<circle cx="39.0" cy="328" r="1.8" fill="#A25836"/>
<text x="52.0" y="332.0" font-family="Source Sans 3 SemiBold" font-size="12" fill="#232E2A" text-anchor="start">Belastende Beziehungen</text>
<text x="52.0" y="346.0" font-family="Source Sans 3" font-size="10" fill="#5C6A64" text-anchor="start">Muster verstehen und gut für sich sorgen.</text>
<circle cx="39.0" cy="367" r="4.5" fill="#F1DBCC"/>
<circle cx="39.0" cy="367" r="1.8" fill="#A25836"/>
<text x="52.0" y="371.0" font-family="Source Sans 3 SemiBold" font-size="12" fill="#232E2A" text-anchor="start">Schwierige Gefühle</text>
<text x="52.0" y="385.0" font-family="Source Sans 3" font-size="10" fill="#5C6A64" text-anchor="start">Raum für das, was schwer wiegt — ohne Wertung.</text>
<circle cx="39.0" cy="406" r="4.5" fill="#F1DBCC"/>
<circle cx="39.0" cy="406" r="1.8" fill="#A25836"/>
<text x="52.0" y="410.0" font-family="Source Sans 3 SemiBold" font-size="12" fill="#232E2A" text-anchor="start">Persönliche Weiterentwicklung</text>
<text x="52.0" y="424.0" font-family="Source Sans 3" font-size="10" fill="#5C6A64" text-anchor="start">Das stärken, was bereits in Ihnen angelegt ist.</text>
<text x="34.0" y="517.0" font-family="Source Sans 3" font-size="9.5" fill="#5C6A64" text-anchor="start">Online · deutschlandweit · Deutsch &amp; English — Erstgespräch unverbindlich.</text>
